# Deployed configuration. Activate with SPRING_PROFILES_ACTIVE=prod.
#
# Nothing secret belongs in this file — it is committed. DB_USER, DB_PASSWORD and
# CORS_ALLOWED_ORIGIN arrive from the environment (see deploy/systemd/ccshareapp.service).

server:
  # Bound to loopback on purpose: the only way in is through nginx, so a
  # misconfigured cloud firewall cannot accidentally expose Tomcat directly.
  address: 127.0.0.1
  port: 8080
  shutdown: graceful
  # LLD §8.4 — sized for a 1GB VM at 2-3 concurrent requests.
  tomcat:
    threads:
      max: 5
      min-spare: 1

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}

spring:
  datasource:
    # DB_HOST is the HeatWave DB System's private endpoint inside the VCN — not
    # loopback. sslMode=REQUIRED because HeatWave serves TLS and Connector/J
    # would otherwise happily fall back to plaintext; `useSSL` is the deprecated
    # spelling and is ignored by Connector/J 8+. No allowPublicKeyRetrieval:
    # that only exists to shuttle caching_sha2 keys over an unencrypted link,
    # which is exactly what we are refusing to do.
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/ccshareapp?sslMode=REQUIRED&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    # Flyway owns the schema; Hibernate only checks that it agrees.
    hibernate:
      ddl-auto: validate
    open-in-view: false

# The jar bundles springdoc, and SecurityConfiguration permits it so the frontend
# interop test can reach /v3/api-docs locally. Publishing an interactive console
# for a card vault is not something to leave to an nginx rule alone, so the
# endpoints are switched off at the source here. nginx blocks them too (defence
# in depth, not redundancy — either layer can be misconfigured).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  file:
    path: /var/log/ccshareapp
  level:
    # logback-spring.xml pins these to DEBUG for local work. Spring Boot applies
    # logging.level.* after logback loads, so these win. DEBUG in production
    # would write request bodies and security internals to disk on the same box
    # that holds the ciphertext.
    com.soham.ccshareapp: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    # logback-spring.xml pins org.hibernate.SQL to DEBUG outside its <springProfile>
    # blocks, so the prod block's root=WARN does not reach it — an explicit logger
    # level always beats root. That is one disk write per query, against a 1GB
    # log cap on a shared box, and it buries the entries worth reading.
    org.hibernate.SQL: WARN
