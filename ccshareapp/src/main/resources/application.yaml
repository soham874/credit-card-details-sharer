app:
  cors:
    # Dev default: the Vite dev server. Overridden per-environment — see
    # application-prod.yaml for the deployed origin.
    allowed-origin: http://localhost:5173

spring:
  application:
    name: ccshareapp
  datasource:
    url: jdbc:h2:mem:cardsharer
    driverClassName: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop