# nginx site for the Card Vault API.  ->  /etc/nginx/sites-available/ccshareapp
#
# Replace api.example.dedyn.io with your deSEC name and soham874.github.io with
# your Pages origin before enabling.
#
# The rate limits here are not decoration. CardFetchService's own class comment
# notes that per-card lockout cannot bound passkey guessing (a wrong passkey
# derives a different identifier, so the real row is never touched) and hands
# that job to per-IP limiting. Nothing in the application implements it. These
# two zones are currently the only thing standing between a card and an online
# guessing attack.

limit_req_zone $binary_remote_addr zone=fetch:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=create:10m rate=20r/h;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.dedyn.io;

    # Leave this reachable — certbot renews over HTTP-01 through it.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.dedyn.io;

    ssl_certificate     /etc/letsencrypt/live/api.example.dedyn.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.dedyn.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    server_tokens off;

    # Largest legitimate body is roughly 1.5KB (a 512-byte blob in base64 plus a
    # 512-char verifier). 8k is headroom, not a budget.
    client_max_body_size 8k;
    client_body_timeout  10s;
    limit_conn conn 10;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options   "nosniff"    always;
    add_header Referrer-Policy          "no-referrer" always;

    # CORS is answered by Spring (SecurityConfiguration#corsConfigurationSource).
    # Do NOT add add_header Access-Control-* here — two sources produce duplicate
    # Access-Control-Allow-Origin headers and every browser rejects the response.

    # Belt and braces alongside springdoc.*.enabled=false in application-prod.yaml.
    location ~ ^/(swagger-ui|v3/api-docs|actuator|h2-console) {
        return 404;
    }

    location = /fetch {
        limit_req zone=fetch burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location = /create {
        limit_req zone=create burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # The API has exactly two endpoints. Everything else is someone probing.
    location / {
        return 404;
    }
}
